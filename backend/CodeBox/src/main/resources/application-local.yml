spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/CodeBox?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  # kafka 消费者相关配置
  kafka:
    bootstrap-servers: 192.168.15.128:9092
    listener:
      ack-mode: manual
    consumer:
      group-id: test-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

# Docker基本配置
docker:
  host: tcp://localhost:2375
  ConnectTimeout: 10000
  ReadTimeout: 10000


# 工作目录
workspace:
  baseDir: 'D:/task'  # 评测任务目录
  dataDir: 'D:/data'  # 测试数据存放目录

# 任务配置
task:
  topic: 'task'
  groupId: '1'