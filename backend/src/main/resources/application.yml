# 项目通用配置文件

server:
  port: 8080  # 端口
  servlet:
    encoding:
      charset: UTF-8  # 字符编码
      force: true     # 强制使用该编码

spring:
  application:
    name: coderank  # 项目名称
  profiles:
    active: dev  # 激活的配置文件
  config:
    import: optional:file:./.env[.properties]  # 加载.env环境变量
  jackson:
    default-property-inclusion: non_null  # 忽略 null 字段
    date-format: yyyy-MM-dd HH:mm:ss      # 日期时间格式
    time-zone: GMT+8                      # 时区
