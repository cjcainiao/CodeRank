# 项目通用配置文件

server:
  port: 8081  # 端口
  servlet:
    encoding:
      charset: UTF-8  # 字符编码
      force: true     # 强制编码

spring:
  application:
    name: coderank  # 项目名称
  profiles:
    active: dev  # 激活的配置文件
  config:
    import: optional:file:./.env[.properties]  # 环境变量文件
  jackson:
    default-property-inclusion: non_null  # null 字段忽略
    date-format: yyyy-MM-dd HH:mm:ss      # 日期时间格式
    time-zone: GMT+8                      # 时区
  servlet:
    multipart:
      enabled: true              # 文件上传开关
      max-file-size: 10MB        # 单文件上限
      max-request-size: 50MB     # 单次请求上限
      file-size-threshold: 1MB   # 临时文件阈值

# 文件上传配置
file:
  upload:
    root: ${FILE_UPLOAD_ROOT:./data}  # 上传根目录
    test-data:                        # 题目评测数据
      dir: testdata                   # 子目录
      allowed-extensions: in,out      # 允许的扩展名

# HTTP 客户端配置
http-client:
  judge:                         # 评测机专用：耗时较长，不重试
    max-total: 20                # 全局最大连接数
    max-per-route: 10            # 单台评测机最大连接数，与调度并发上限呼应
    connect-timeout: 5s          # 建立连接超时
    response-timeout: 60s        # 等待响应超时，覆盖多测试点判题耗时
    idle-evict: 5m               # 空闲连接回收时间
    keep-alive: 10m              # 连接保活时间
    validate-after-inactivity: 1s  # 空闲超过该时长后使用前校验

# 评测配置
judge:
  compile:                     # 编译阶段：编译器比用户程序更吃资源
    cpu-limit: 20s             # CPU 时间上限
    clock-limit: 30s           # 墙钟时间上限
    memory-limit: 1073741824   # 内存上限，字节
    proc-limit: 256            # 进程数上限
  run:                         # 运行阶段兜底：题目未配置时使用
    cpu-limit: 5s              # CPU 时间上限
    clock-limit: 10s           # 墙钟时间上限
    memory-limit: 268435456    # 内存上限，字节
    proc-limit: 64             # 进程数上限
    output-limit: 1048576      # 输出上限，字节
    clock-factor: 2            # 墙钟相对 CPU 的放大倍数，给启动开销留余量
  sandbox:
    path: /usr/local/bin:/usr/bin:/bin  # 容器内可执行文件搜索路径
