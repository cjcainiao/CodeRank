server:
  port: 8083

spring:
  application:
    name: judge
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/coderank?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

minio:
  endpoint: ${MINIO_ENDPOINT:http://154.219.99.249:9000}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  max-idle-connections: 16
  keep-alive-duration: 5m
  connect-timeout: 5s
  read-timeout: 30s
  write-timeout: 30s
